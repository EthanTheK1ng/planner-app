<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Planner">

    <link rel="apple-touch-icon" href="icons/planner-192.png">
    <link rel="icon" type="image/png" href="icons/planner-192.png">

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Test Planner</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js" defer></script>
    <script src="script.js" defer></script>
    <script src="notifications.js" defer></script>
</head>

<body>

    <!-- Initial cloud loading screen -->
    <div id="app-loading-screen" class="loading-screen">
        <div class="loading-card">
            <div class="loading-spinner"></div>
            <p>Loading your planner…</p>
        </div>
    </div>

    <main class="planner" id="planner">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="planner-header">

            <div class="header-left">
                <h1 id="greeting-text">Welcome, Ethan</h1>

                <p id="current-date">
                    DATE HERE
                </p>
            </div>

            <div class="header-actions">

                <!-- Notifications intentionally left as-is -->
                <button
                    id="enable-notifications-button"
                    type="button"
                    aria-label="Enable Notifications"
                    title="Notifications"
                >
                    Enable Notifications
                </button>

                <button
                    id="new-entry-button"
                    type="button"
                >
                    New Entry
                </button>

            </div>

        </header>


        <!-- =========================
             SUMMARY
        ========================== -->

        <section class="summary">

            <p class="summary-text">
                You have
                <span id="assignment-count">0</span>
                assignments to complete
            </p>

            <p class="summary-text">
                You have
                <span id="exam-count">0</span>
                exams/quizzes coming up
            </p>

        </section>


        <!-- =========================
             DUE
        ========================== -->

        <section
            class="planner-section"
            id="due-section"
        >

            <div class="section-title-row">
                <h2>Due</h2>
            </div>

            <div id="entry-groups"></div>

        </section>


        <!-- =========================
             COMPLETED
        ========================== -->

        <section class="completed-section">

            <div class="completed-header">

                <h2>
                    Completed Assignments
                </h2>

                <button
                    id="clear-completed-button"
                    class="clear-completed-button"
                    type="button"
                    style="display: none;"
                >
                    Clear
                </button>

            </div>

            <div id="completed-list"></div>

        </section>

    </main>


    <!-- =========================
         ADD / EDIT ENTRY DIALOG
    ========================== -->

    <dialog id="new-entry-dialog">

        <form id="new-entry-form">

            <div class="form-header">

                <h2 id="entry-dialog-title">
                    New Entry
                </h2>

                <button
                    type="button"
                    id="close-entry-button"
                    class="close-button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <label for="entry-name">
                Name
            </label>

            <input
                type="text"
                id="entry-name"
                placeholder="Enter name here"
                autocomplete="off"
                required
            >


            <label>
                Subject
            </label>

            <input
                type="hidden"
                id="entry-subject"
                required
            >

            <div
                id="subject-options"
                class="choice-grid subject-choice-grid"
            ></div>


            <label>
                Type
            </label>

            <input
                type="hidden"
                id="entry-type"
                value="assignment"
                required
            >

            <div
                id="type-options"
                class="choice-grid type-choice-grid"
            >

                <button
                    type="button"
                    class="choice-button type-choice"
                    data-value="assignment"
                    style="--choice-color: #2563eb;"
                >
                    Assignment
                </button>

                <button
                    type="button"
                    class="choice-button type-choice"
                    data-value="exam"
                    style="--choice-color: #ea580c;"
                >
                    Exam
                </button>

                <button
                    type="button"
                    class="choice-button type-choice"
                    data-value="quiz"
                    style="--choice-color: #7c3aed;"
                >
                    Quiz
                </button>

            </div>


            <label for="entry-due-date">
                Due Date
            </label>

            <div class="date-input-row">

                <input
                    type="date"
                    id="entry-due-date"
                >

                <button
                    type="button"
                    id="no-due-date-button"
                    class="no-due-date-button"
                >
                    No due date
                </button>

            </div>


            <button
                type="submit"
                class="add-entry-button"
                id="save-entry-button"
            >
                <span class="button-spinner" aria-hidden="true"></span>
                <span id="save-entry-button-text">Add Entry</span>
            </button>

        </form>

    </dialog>


    <!-- =========================
         SWIPE ACTIONS
    ========================== -->

    <dialog id="entry-actions-dialog" class="actions-dialog">

        <div class="actions-card">

            <p
                id="actions-entry-name"
                class="actions-entry-name"
            ></p>

            <button
                type="button"
                id="edit-entry-button"
                class="action-button"
            >
                Edit
            </button>

            <button
                type="button"
                id="delete-entry-button"
                class="action-button delete-action-button"
            >
                Delete
            </button>

            <button
                type="button"
                id="cancel-entry-actions-button"
                class="action-button cancel-action-button"
            >
                Cancel
            </button>

        </div>

    </dialog>

</body>

</html>
